[project]
name = "audioanalytic"
version = "0.2.0"
description = "АС «АудиоАналитик ИИ»: локальная транскрибация, диаризация, база знаний и веб-интерфейс (ГОСТ 34.602-2020)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
ml = [
    "whisperx",
]
postgres = [
    "psycopg[binary]>=3.1.0",
]
ffmpeg = [
    "imageio-ffmpeg>=0.5.1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
audioanalytic = "audioanalytic.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audioanalytic = ["web/static/**/*", "web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
