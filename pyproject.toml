[project]
name = "audioanalytic"
version = "0.1.0"
description = "АудиоАналитик ИИ: локальная транскрибация лекций (WhisperX) и подготовка текста для LLM-конспекта"
requires-python = ">=3.10,<3.14"
dependencies = ["whisperx"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
audioanalytic = "audioanalytic.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
